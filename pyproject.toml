[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-taxonomy"
version = "0.1.0"
description = "Hierarchical content classification for video metadata"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "pyarrow>=16,<27"]

[project.optional-dependencies]
model = ["torch>=2.6,<3", "transformers>=4.51,<6"]

[project.scripts]
video-taxonomy = "video_taxonomy.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]
